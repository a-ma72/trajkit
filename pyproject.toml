[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajkit"
version = "0.1.0"
description = "Vehicle GPS track conditioning: EKF/RTS sensor fusion, clothoid curvature analysis, and Fresnel-integral path reconstruction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "matplotlib>=3.7",
    "contextily>=1.3",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 — tells type checkers (mypy, pyright) this package ships type info
trajkit = ["py.typed"]
"trajkit.docs" = ["**/*"]
"trajkit.notebooks" = ["**/*"]
